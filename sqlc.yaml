version: "2"
sql:
  - schema: "db/migration/"
    queries: "db/query/"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "db/sqlc"

        # Generate JSON tags for the DB model structs
        emit_json_tags: true

        # Generate Querier interface, since it’ll be used to generate mocks for unit testing
        emit_interface: true

        # Slices returned by the query to be empty instead of nil
        emit_empty_slices: true

version: "3.9"
services:
  postgres:
    container_name: simplebank_postgres
    image: postgres:10-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=simple_bank
  api:
    build:
      context: ../
      dockerfile: deployment/Dockerfile
    container_name: simplebank_api
    image: simplebank
    ports:
      - "8080:8080"
    environment:
      - DB_SOURCE=postgresql://postgres:postgres@postgres:5432/simple_bank?sslmode=disable
      - GIN_MODE=release
    depends_on:
      - postgres
    entrypoint: [ "/app/wait-for.sh", "postgres:5432", "--", "/app/start.sh" ] # override entrypoint in Dockerfile
    command: [ "/app/main" ]

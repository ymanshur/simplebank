# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  test:
    name: Run units (with short flag) inlcuding queries tests
    runs-on: ubuntu-latest

    services:
      # References: https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers
      postgres:
        image: postgres:14-alpine
        ports:
          - 5432:5432

        # Provide the default PostgreSQL password and database name
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simplebank

        # Set health checks to wait until postgres has started
        #
        # TODO: Enable sslmode is necessary for sercure communication
        # especially when the database is hosted remotely,
        # while it is not strictly for a local instance
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.24.6

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.15.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/bin/migrate
          which migrate

      - name: Run database migrations
        run: make migrateup

      - name: Create config file for test
        run: |
          echo 'DB_SOURCE=postgresql://postgres:postgres@localhost:5432/simplebank?sslmode=disable' >> app.env

      - name: Test
        run: make test
